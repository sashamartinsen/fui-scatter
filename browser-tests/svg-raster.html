<!doctype html><meta charset="utf-8"><base href="../dist/"><pre id="results">Testing...</pre><script type="module">import{initializeLibrary,libraryAsset,library}from'./shape-library.js?v=3';import{shapeSVG,svgImage,parseAsset}from'./svg-assets.js?v=2';import{restorePreset}from'./composition-presets.js';import{compose}from'./engine.js';import{rasterComposition,postprocess}from'./render.js?v=2';try{await initializeLibrary();const rows=[];for(const entry of library.files){const a=await libraryAsset(entry.id);for(let i=0;i<a.shapes.length;i++){const s=a.shapes[i],image=await svgImage(shapeSVG(s,'#ffffff',128)),c=document.createElement('canvas');c.width=c.height=128;const ctx=c.getContext('2d');ctx.drawImage(image,0,0);const data=ctx.getImageData(0,0,128,128).data;let pixels=0;for(let j=3;j<data.length;j+=4)if(data[j])pixels++;rows.push({name:entry.name,index:i,pixels,cx:s.cx,cy:s.cy,width:s.width,height:s.height,svg:pixels===0?shapeSVG(s,'#ffffff',128):undefined})}}if(rows.some(r=>r.pixels===0))throw Error('One or more SVG objects rasterized empty');const preset=await(await fetch('presets/b1-verge-ep-cover-art.scatter.json')).json(),state=await restorePreset(preset,{libraryAsset,parseAsset}),preview=postprocess(await rasterComposition(compose(state.layers,state.width,state.height),state,.75),state.effects,.75);document.body.prepend(preview);const result={agent:navigator.userAgent,rows};document.querySelector('#results').textContent=JSON.stringify(result);if(new URLSearchParams(location.search).has('report'))await fetch('/result',{method:'POST',body:JSON.stringify({...result,preview:preview.toDataURL('image/png')})})}catch(e){const r={error:e.stack};document.querySelector('#results').textContent=JSON.stringify(r);if(new URLSearchParams(location.search).has('report'))await fetch('/result',{method:'POST',body:JSON.stringify(r)})}</script>
